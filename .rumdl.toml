[global]
# NOTICE.md reproduces third-party notices verbatim.
exclude = ["NOTICE.md"]
# The README opens with the centered logo, and the pull request template with
# a prompt rather than a heading.
disable = ["MD041"]

[MD013]
# Prose wraps at 80; paths and code may run longer.
line-length = 100
code-blocks = false

[MD033]
allowed-elements = ["p", "img"]

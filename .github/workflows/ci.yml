name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; inherited from the source repository
      - name: Check toolchain
        run: swift --version
      - name: Unit tests
        run: make test
      - name: Build and stage macOS plugin
        if: runner.os == 'macOS'
        run: make stage
  lint:
    # macOS, so swift format is Xcode's, the same one contributors run.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; inherited from the source repository
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false
          cache: false
      - name: Install linters
        run: mise install --locked
      - name: Lint
        run: mise run check

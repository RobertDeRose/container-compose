name: Machine image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Sources/ContainerCompose/Resources/**
      - .github/workflows/machine-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: machine-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    # The machine runs on Apple silicon, so only linux/arm64 is published.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; inherited from the source repository
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${OWNER,,}/container-compose-machine"
          tags=(--tag "$image:sha-${GITHUB_SHA::12}")
          if [[ $REF_TYPE == tag ]]; then
            tags+=(--tag "$image:${REF_NAME#v}")
          elif [[ $REF_NAME == main ]]; then
            tags+=(--tag "$image:edge")
          fi
          docker buildx create --use
          docker buildx build \
            --platform linux/arm64 \
            --file Sources/ContainerCompose/Resources/Containerfile \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=Persistent Docker machine for the container compose plugin" \
            "${tags[@]}" \
            --metadata-file metadata.json \
            --push \
            Sources/ContainerCompose/Resources
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          {
            echo "### Published $image"
            echo
            echo "Pin with \`$image@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
